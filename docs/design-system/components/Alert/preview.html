<!-- @dsCard group="Feedback" height=420 -->
<div style="display:flex;flex-direction:column;gap:16px;padding:24px;background:var(--bg)">
  <div class="hl-alert" role="status"><svg class="hl-mark" viewBox="0 0 20 20" aria-hidden="true"><rect x="2.75" y="2.75" width="14.5" height="14.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><div><div class="hl-alert__title">Comments are off for this post</div><div class="hl-alert__text">You can still reply by email.</div></div></div>
  <div class="hl-alert" role="status"><svg class="hl-mark" viewBox="0 0 20 20" aria-hidden="true"><rect x="2.75" y="2.75" width="14.5" height="14.5" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="5.5" y="5.5" width="9" height="9" fill="currentColor"/></svg><div><div class="hl-alert__title">Changes saved</div><div class="hl-alert__text">Your post is live.</div></div></div>
  <div class="hl-alert" role="status"><svg class="hl-mark" viewBox="0 0 20 20" aria-hidden="true"><rect x="2.75" y="2.75" width="14.5" height="14.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2.75 17.25 L17.25 2.75 L17.25 17.25 Z" fill="currentColor"/></svg><div><div class="hl-alert__title">This draft is 3 days old</div><div class="hl-alert__text">Someone else may have edited it. Reload to see the latest version.</div></div></div>
  <div class="hl-alert hl-alert--error" role="alert"><svg class="hl-mark" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="2" width="16" height="16" fill="currentColor"/></svg><div><div class="hl-alert__title">Your post was not published</div><div class="hl-alert__text">The title is empty. Add a title, then publish again.</div></div></div>
</div>
