<div style="display:flex;gap:40px;flex-wrap:wrap;padding:24px;background:var(--bg)">
  <label class="hl-field">
    <span class="hl-field__label">Project name</span>
    <input class="hl-field__input" value="field-notes">
    <span class="hl-field__help">Lowercase letters and hyphens.</span>
  </label>
  <label class="hl-field hl-field--error">
    <span class="hl-field__label">Email</span>
    <input class="hl-field__input" placeholder="you@example.com">
    <span class="hl-field__help">Enter an email address with an @ sign.</span>
  </label>
</div>
