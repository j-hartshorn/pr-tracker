<!-- @dsCard height=288 -->
<div class="cv">
  <style>
    html,body{margin:0}
    .cv{position:relative;width:960px;height:288px;background:var(--bg);overflow:hidden}
    .art{position:absolute;left:480px;top:0}
    .b-ink{fill:var(--ink)} .b-line{fill:var(--line)} .b-muted{fill:var(--ink-muted)} .b-acc{fill:var(--accent)}
    rect{rx:var(--radius-none)}
    .r{stroke:var(--line-strong);stroke-width:var(--stroke-hair);shape-rendering:crispEdges}
    .txt{position:absolute;left:40px;bottom:40px;max-width:440px}
    .name{font-family:var(--font-prose);font-weight:300;font-size:88px;line-height:.92;color:var(--ink);letter-spacing:-0.01em}
    .tag{margin-top:16px;font-family:var(--font-prose);font-size:14px;line-height:20px;color:var(--ink-muted)}
  </style>
  <svg class="art" viewBox="480 0 480 288" width="480" height="288" aria-hidden="true">
    <!--
      blocks: ink 208x208 (space-6*3.25 ~ 13 x space-3), line 168x184, ink-muted 104x80 (space-7 wide), accent 40x40 (space-5) — corners radius-none
      arrangement: one tall ink slab bleeding off the top, satellites bleeding right and bottom; the accent is the smallest block, as in use
      pattern: hairline rules (README: "Lines make structure", stroke-hair 1px in line-strong) — four rules crossing the blocks
      scales: space-3 16, space-5 40, space-6 64, space-7 104; radius-none; stroke-hair 1px
    -->
    <rect class="b-ink" x="584" y="0" width="208" height="208"/>
    <rect class="b-line" x="792" y="104" width="168" height="184"/>
    <rect class="b-muted" x="688" y="208" width="104" height="80"/>
    <rect class="b-acc" x="832" y="40" width="40" height="40"/>
    <line class="r" x1="480" y1="104.5" x2="960" y2="104.5"/>
    <line class="r" x1="480" y1="208.5" x2="960" y2="208.5"/>
    <line class="r" x1="688.5" y1="0" x2="688.5" y2="288"/>
    <line class="r" x1="896.5" y1="0" x2="896.5" y2="288"/>
  </svg>
  <div class="txt">
    <div class="name">Hairline</div>
    <div class="tag">Thin lines, quiet greys, one colour used once.</div>
  </div>
</div>
