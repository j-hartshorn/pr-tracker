<!-- @dsCard group="Feedback" height=180 -->
<div style="display:flex;flex-direction:column;gap:16px;padding:24px;background:var(--bg)">
  <div class="hl-toast" role="status"><div class="hl-toast__msg"><svg class="hl-mark" viewBox="0 0 20 20" aria-hidden="true"><rect x="2.75" y="2.75" width="14.5" height="14.5" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="5.5" y="5.5" width="9" height="9" fill="currentColor"/></svg><span>Draft saved</span></div><button class="hl-toast__action">Undo</button></div>
  <div class="hl-toast hl-toast--error" role="alert"><div class="hl-toast__msg"><svg class="hl-mark" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="2" width="16" height="16" fill="currentColor"/></svg><span>Couldn't publish. Check your connection.</span></div><button class="hl-toast__action">Try again</button></div>
</div>
